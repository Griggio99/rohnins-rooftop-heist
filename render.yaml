services:
  - type: web
    name: rohnins-rooftop-heist
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /api/ping
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: heist-data
      mountPath: /var/data
      sizeGB: 1
